x-common-logging: &common-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  mysql:
    image: mysql:8.4.10
    container_name: baituan-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=${MYSQL_INNODB_BUFFER_POOL_SIZE:-512M}
      - --max-connections=${MYSQL_MAX_CONNECTIONS:-200}
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-club}
      MYSQL_USER: ${MYSQL_USER:-baituan_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
      - ./club_finalversion.sql:/docker-entrypoint-initdb.d/01-club.sql:ro
      - ./club_springboot/database/production_indexes.sql:/docker-entrypoint-initdb.d/02-production-indexes.sql:ro
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot --password=\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
    security_opt:
      - no-new-privileges:true
    # 生产规模关系查询会同时使用 InnoDB 缓冲池、连接缓冲和排序临时区；1 GiB 压测时会触发容器重启。
    mem_limit: ${MYSQL_MEMORY_LIMIT:-2g}
    cpus: ${MYSQL_CPU_LIMIT:-1.5}
    pids_limit: 300
    logging: *common-logging

  redis:
    image: redis:7.4.9-alpine
    container_name: baituan-redis
    restart: unless-stopped
    # 让官方入口脚本直接识别 redis-server，完成数据卷初始化后再降权运行。
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --requirepass
      - ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      - --maxmemory
      - ${REDIS_MAXMEMORY:-384mb}
      - --maxmemory-policy
      - allkeys-lru
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      REDIS_MAXMEMORY: ${REDIS_MAXMEMORY:-384mb}
      TZ: Asia/Shanghai
    volumes:
      - redis_data:/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Redis 入口脚本需要这些最小权限初始化命名卷，随后会降权为 redis 用户运行服务。
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    mem_limit: ${REDIS_MEMORY_LIMIT:-512m}
    cpus: ${REDIS_CPU_LIMIT:-1.0}
    pids_limit: 100
    logging: *common-logging

  backend:
    build:
      context: .
      dockerfile: deploy/docker/backend.Dockerfile
    image: baituan/backend:${APP_IMAGE_TAG:-local}
    container_name: baituan-backend
    restart: unless-stopped
    init: true
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8081
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-club}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: ${MYSQL_USER:-baituan_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-30}
      DB_POOL_MIN_IDLE: ${DB_POOL_MIN_IDLE:-5}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      REDIS_POOL_MAX_ACTIVE: ${REDIS_POOL_MAX_ACTIVE:-200}
      JWT_SECRET: ${JWT_SECRET:?Set a random JWT_SECRET of at least 32 bytes in .env}
      JWT_EXPIRE_SECONDS: ${JWT_EXPIRE_SECONDS:-604800}
      UPLOAD_DIR: /var/baituan/upload/
      LOG_PATH: /var/log/baituan
      RATE_LIMIT_FAIL_OPEN: "false"
      REDIS_HEALTH_ENABLED: "true"
      BUSINESS_CACHE_ENABLED: ${BUSINESS_CACHE_ENABLED:-true}
      REQUEST_LOG_ENABLED: ${REQUEST_LOG_ENABLED:-false}
      KAFKA_ENABLED: ${KAFKA_ENABLED:-false}
      KAFKA_LISTENER_AUTO_STARTUP: ${KAFKA_LISTENER_AUTO_STARTUP:-false}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set production frontend origins in .env}
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError}
      TZ: Asia/Shanghai
    volumes:
      - backend_uploads:/var/baituan/upload
      - backend_logs:/var/log/baituan
    networks:
      - app
      - data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/actuator/health"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 60s
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: ${BACKEND_MEMORY_LIMIT:-768m}
    cpus: ${BACKEND_CPU_LIMIT:-2.0}
    pids_limit: 300
    logging: *common-logging

  frontend:
    build:
      context: .
      dockerfile: deploy/docker/frontend.Dockerfile
      args:
        VUE_APP_STUDENT_URL: ${FRONTEND_STUDENT_URL:-http://localhost:9533/#/login}
        VUE_APP_ADMIN_URL: ${FRONTEND_ADMIN_URL:-http://localhost:9531/#/login}
        VUE_APP_SUPERADMIN_URL: ${FRONTEND_SUPERADMIN_URL:-http://localhost:9532/#/login}
    image: baituan/frontend:${APP_IMAGE_TAG:-local}
    container_name: baituan-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${PUBLIC_BIND_ADDRESS:-127.0.0.1}:9527:9527"
      - "${PUBLIC_BIND_ADDRESS:-127.0.0.1}:9533:9533"
      - "${PUBLIC_BIND_ADDRESS:-127.0.0.1}:9531:9531"
      - "${PUBLIC_BIND_ADDRESS:-127.0.0.1}:9532:9532"
    networks:
      - edge
      - app
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9527/"]
      interval: 20s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    mem_limit: ${FRONTEND_MEMORY_LIMIT:-256m}
    cpus: ${FRONTEND_CPU_LIMIT:-1.0}
    pids_limit: 100
    logging: *common-logging

  kafka:
    image: apache/kafka:3.9.2
    container_name: baituan-kafka
    restart: unless-stopped
    profiles: ["mq"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: ${KAFKA_NUM_PARTITIONS:-6}
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      TZ: Asia/Shanghai
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server 127.0.0.1:9092 >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    mem_limit: ${KAFKA_MEMORY_LIMIT:-1g}
    cpus: ${KAFKA_CPU_LIMIT:-1.5}
    pids_limit: 300
    logging: *common-logging

networks:
  edge:
  app:
    internal: true
  data:
    internal: true

volumes:
  mysql_data:
  redis_data:
  backend_uploads:
  backend_logs:
  kafka_data:
