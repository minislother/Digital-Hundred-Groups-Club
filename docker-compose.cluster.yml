# 叠加现有生产 Compose：保留原环境变量、数据库和共享上传卷。
services:
  backend-replica:
    extends:
      file: docker-compose.yml
      service: backend
    container_name: baituan-backend-replica
  consul:
    image: hashicorp/consul:1.22.7
    command: agent -server -bootstrap-expect=1 -client=0.0.0.0 -data-dir=/consul/data -config-dir=/consul/config
    volumes:
      - consul_data:/consul/data
      - ./deploy/consul/services.json:/consul/config/services.json:ro
    networks: [app]
    restart: unless-stopped
  gateway:
    deploy:
      replicas: 2
    build:
      context: .
      dockerfile: deploy/docker/gateway.Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: cluster
      CONSUL_HOST: consul
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
      # 代理后的限流粒度为直接连接对端；默认不启用，避免所有浏览器共享一个 IP 配额。
      GATEWAY_RATE_LIMIT_ENABLED: "false"
    depends_on:
      backend:
        condition: service_healthy
      backend-replica:
        condition: service_healthy
      consul:
        condition: service_started
    networks: [app, edge]
    restart: unless-stopped
  frontend:
    volumes:
      - ./deploy/nginx/cluster.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      gateway:
        condition: service_started
volumes:
  consul_data:
