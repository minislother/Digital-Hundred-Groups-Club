# 显式启用 schema profile 才接管数据库升级；已有数据库须先备份并核对基线。
spring.flyway.enabled=true
spring.flyway.user=${DB_MIGRATION_USERNAME:${spring.datasource.username}}
spring.flyway.password=${DB_MIGRATION_PASSWORD:${spring.datasource.password}}
spring.flyway.locations=classpath:db/flyway
spring.flyway.baseline-version=1
spring.flyway.baseline-on-migrate=${DB_BASELINE_EXISTING:false}
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
app.cache-retry.initialize-schema=false
