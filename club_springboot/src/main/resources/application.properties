server.port=${SERVER_PORT:8081}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/club?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

spring.thymeleaf.check-template-location=false
upload-dir=${UPLOAD_DIR:upload/}
jwt.expire-seconds=${JWT_EXPIRE_SECONDS:604800}

spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:10MB}

mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.chinahitech.shop.bean
mybatis.configuration.map-underscore-to-camel-case=true
mybatis-plus.mapper-locations=classpath:mapper/*.xml
mybatis-plus.type-aliases-package=com.chinahitech.shop.bean,com.chinahitech.shop.bean.notAddedToDatabase
mybatis-plus.configuration.map-underscore-to-camel-case=true

spring.data.redis.database=${REDIS_DATABASE:0}
spring.data.redis.host=${REDIS_HOST:127.0.0.1}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.jedis.pool.max-active=${REDIS_POOL_MAX_ACTIVE:200}
spring.data.redis.jedis.pool.max-wait=${REDIS_POOL_MAX_WAIT:-1ms}
spring.data.redis.jedis.pool.max-idle=${REDIS_POOL_MAX_IDLE:200}
spring.data.redis.jedis.pool.min-idle=${REDIS_POOL_MIN_IDLE:0}
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:5000}
app.rate-limit.fail-open=${RATE_LIMIT_FAIL_OPEN:true}
app.business-cache.enabled=${BUSINESS_CACHE_ENABLED:true}
app.business-cache.local.enabled=${LOCAL_CACHE_ENABLED:true}
app.business-cache.local.maximum-size=${LOCAL_CACHE_MAXIMUM_SIZE:10000}
app.business-cache.local.ttl-seconds=${LOCAL_CACHE_TTL_SECONDS:30}
app.business-cache.local.invalidation-enabled=${LOCAL_CACHE_INVALIDATION_ENABLED:false}
app.request-log.enabled=${REQUEST_LOG_ENABLED:true}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
app.kafka.enabled=${KAFKA_ENABLED:false}
app.kafka.listener.auto-startup=${KAFKA_LISTENER_AUTO_STARTUP:false}
app.activity.redis-fallback.max-requests-per-second=${ACTIVITY_REDIS_FALLBACK_MAX_RPS:20}
app.elasticsearch.enabled=${ELASTICSEARCH_ENABLED:false}
app.elasticsearch.host=${ELASTICSEARCH_HOST:127.0.0.1}
app.elasticsearch.port=${ELASTICSEARCH_PORT:9200}
app.elasticsearch.scheme=${ELASTICSEARCH_SCHEME:http}
app.elasticsearch.index=${ELASTICSEARCH_INDEX:baituan_activity_v2}
app.elasticsearch.username=${ELASTICSEARCH_USERNAME:}
app.elasticsearch.password=${ELASTICSEARCH_PASSWORD:}
app.kafka.listener.concurrency=${KAFKA_LISTENER_CONCURRENCY:1}
app.activity.async-write-enabled=${ACTIVITY_ASYNC_WRITE_ENABLED:false}
app.activity.outbox.interval-ms=${ACTIVITY_OUTBOX_INTERVAL_MS:3000}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=${KAFKA_PRODUCER_ACKS:1}
spring.kafka.producer.retries=${KAFKA_PRODUCER_RETRIES:3}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:activity-group}
spring.kafka.consumer.auto-offset-reset=${KAFKA_AUTO_OFFSET_RESET:earliest}
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.kafka.topic.activity=${KAFKA_TOPIC_ACTIVITY:activity_topic}
spring.kafka.topic.activity-cache=${KAFKA_TOPIC_ACTIVITY_CACHE:activity_cache_topic}
spring.kafka.topic.group=${KAFKA_TOPIC_GROUP:group_topic}
spring.kafka.topic.group-cache=${KAFKA_TOPIC_GROUP_CACHE:group_cache_topic}
spring.kafka.topic.individual-group=${KAFKA_TOPIC_INDIVIDUAL_GROUP:individual_group_topic}
spring.kafka.topic.individual-activity=${KAFKA_TOPIC_INDIVIDUAL_ACTIVITY:individual_activity_topic}
spring.kafka.topic.user-import=${KAFKA_TOPIC_USER_IMPORT:user_import_topic}

logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.org.springframework.web=${LOG_LEVEL_SPRING_WEB:INFO}
logging.level.org.springframework.boot=${LOG_LEVEL_SPRING_BOOT:INFO}
logging.level.com.chinahitech.shop.mapper=${MYBATIS_LOG_LEVEL:debug}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# Redis is reported by global health. MySQL is the required dependency for admission fallback.
management.endpoint.health.group.traffic.include=db,ping
management.health.redis.enabled=${REDIS_HEALTH_ENABLED:false}

# 数据库迁移由显式 schema profile 接管，避免直接接管未核对的存量库。
spring.flyway.enabled=false

# Enable only after applying V8__user_import_tasks.sql (schema profile or reviewed manual migration).
app.user-import.enabled=${USER_IMPORT_ENABLED:false}
app.user-import.global-concurrency=${USER_IMPORT_CONCURRENCY:2}
app.user-import.batch-size=${USER_IMPORT_BATCH_SIZE:500}
app.user-import.max-pending=${USER_IMPORT_MAX_PENDING:100}
app.user-import.max-rows=${USER_IMPORT_MAX_ROWS:200000}
app.user-import.directory=${USER_IMPORT_DIRECTORY:data/user-import}
