# Nginx runtime config used by the frontend Docker image.
server_tokens off;

upstream baituan_backend {
    server backend:8081;
    keepalive 32;
}

map $sent_http_content_type $expires {
    default off;
    ~*text/css 7d;
    ~*application/javascript 7d;
    ~*image/ 30d;
    ~*font/ 30d;
}

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

# These headers provide conservative browser protections for every frontend.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

server {
    listen 9527;
    server_name _;
    root /usr/share/nginx/html/portal;
    index index.html;
    expires $expires;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /health {
        proxy_pass http://baituan_backend/actuator/health/traffic;
        proxy_set_header Host $host;
    }
}

server {
    listen 9533;
    server_name _;
    root /usr/share/nginx/html/student;
    index index.html;
    expires $expires;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ^~ /api/knowledge/ {
        proxy_buffering off;
        proxy_read_timeout 200s;
        proxy_pass http://baituan_backend/knowledge/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://baituan_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /upload/ {
        proxy_pass http://baituan_backend/upload/;
    }
}

