global:
  scrape_interval: 15s
scrape_configs:
  - job_name: club-backend
    metrics_path: /actuator/prometheus
    authorization:
      credentials_file: /run/secrets/backend_metrics_token
    static_configs:
      - targets: ['backend:8081', 'backend-replica:8081']
  - job_name: gateway
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names: ['gateway']
        type: A
        port: 9090
