name: Frontend verification
on:
  push:
    paths: ['vue_*/**', 'web_portal/**', 'frontend-shared/**', 'pnpm-*', '.github/workflows/frontends.yml']
  pull_request:
    paths: ['vue_*/**', 'web_portal/**', 'frontend-shared/**', 'pnpm-*', '.github/workflows/frontends.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install -g pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: npm run build:frontends
      - run: npm --prefix vue_student run test:unit
      - run: npm --prefix vue_admin run test:unit
      - run: npm --prefix vue_superadmin run test:unit
      - run: npm --prefix vue_admin run typecheck
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.58.0
      - run: python -m playwright install --with-deps chromium
      - run: python frontend-shared/tests/knowledge_browser.py
